<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Xchange Verse — Reference Rate Management Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xchange Verse is a secure digital exchange platform for fast, transparent, and reliable transactions.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="Xchange Verse, digital exchange, secure transactions, currency exchange">
  <link rel="canonical" href="https://xchangebook.patienceai.in/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Xchange Verse | Secure Digital Exchange Platform">
  <meta property="og:description" content="Trade and exchange with confidence on Xchange Verse.">
  <meta property="og:url" content="https://xchangebook.patienceai.in/">
  <meta property="og:site_name" content="Xchange Verse">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Xchange Verse | Secure Digital Exchange Platform">
  <meta name="twitter:description" content="Trade and exchange with confidence on Xchange Verse.">
  <meta name="theme-color" content="#00d4aa">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Xchange Verse",
      "url": "https://xchangebook.patienceai.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://xchangebook.patienceai.in/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>
<body>
  <app-root>
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .splash-logo {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-xb {
        fill: none;
        stroke: url(#splash-gradient);
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 12px rgba(0, 212, 170, 0.4));
      }
      .splash-loader {
        width: 40px;
        height: 4px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, #00d4aa, #6366f1);
        animation: splash-load 1.5s infinite ease-in-out;
      }
      .splash-text {
        color: #8899a6;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 16px;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes splash-load {
        0% { left: -30%; }
        100% { left: 100%; }
      }
    </style>
    <div class="splash-screen">
      <svg class="splash-logo" viewBox="0 0 64 64" role="img" aria-label="Xchange Verse">
        <defs>
          <linearGradient id="splash-gradient" x1="10%" y1="8%" x2="92%" y2="94%">
            <stop offset="0%" stop-color="#00d4aa" />
            <stop offset="52%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#6366f1" />
          </linearGradient>
        </defs>
        <path class="splash-xb" stroke-width="4" d="M14 40c7-4 14-4 18 1 4-5 11-5 18-1V18c-7-3-14-2-18 3-4-5-11-6-18-3v22Z" />
        <path class="splash-xb" stroke-width="3" opacity="0.7" d="M32 21v24" />
        <path class="splash-xb" stroke-width="6" d="M20 18l24 28M44 18 20 46" />
      </svg>
      <div class="splash-loader"></div>
      <div class="splash-text">Xchange Verse</div>
    </div>
  </app-root>
</body>
</html>
